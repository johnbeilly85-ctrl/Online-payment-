<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temuoffer Admin</title><style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

header {
    background: #ff6a00;
    color: white;
    text-align: center;
    padding: 20px;
}

.box {
    max-width: 1100px;
    margin: 25px auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.12);
}

.login-box {
    max-width: 400px;
}

h3 {
    text-align: center;
}

input,
select {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 16px;
}

button {
    background: #ff6a00;
    color: white;
    border: none;
    padding: 11px 15px;
    border-radius: 7px;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    background: #e55d00;
}

.login-button {
    width: 100%;
    padding: 14px;
    font-size: 17px;
}

.hidden {
    display: none;
}

.message {
    padding: 12px;
    margin: 15px 0;
    border-radius: 7px;
    background: #f1f1f1;
}

.error {
    background: #ffe5e5;
    color: #b00020;
}

.success {
    background: #e5ffe9;
    color: #08752b;
}

.table-container {
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 1100px;
    border-collapse: collapse;
    margin-top: 15px;
}

th,
td {
    border: 1px solid #ddd;
    padding: 10px;
    text-align: left;
    vertical-align: middle;
}

th {
    background: #ff6a00;
    color: white;
}

.status-cell select {
    min-width: 170px;
    margin: 0 0 6px 0;
}

.save-button {
    background: #168a3a;
    width: 100%;
}

.save-button:hover {
    background: #116b2d;
}

@media (max-width: 700px) {
    .box {
        margin: 10px;
        padding: 15px;
    }
}
</style></head><body><header>
    <h2>Temuoffer Admin Dashboard</h2>
</header><!-- LOGIN --><div class="box login-box" id="loginBox"><h3>Admin Login</h3>

<label>Username</label>

<input
    type="text"
    id="username"
    placeholder="Enter username"
    autocomplete="username"
>

<label>Password</label>

<input
    type="password"
    id="password"
    placeholder="Enter password"
    autocomplete="current-password"
>

<button
    class="login-button"
    onclick="login()"
>
    Login
</button>

<div id="loginError"></div>

</div><!-- DASHBOARD --><div class="box hidden" id="dashboard"><h3>Customer Orders</h3>

<button onclick="loadOrders()">
    Refresh Orders
</button>

<div id="orderCount" class="message">
    Loading orders...
</div>

<div id="statusMessage"></div>

<div class="table-container">

    <table>

        <thead>

            <tr>
                <th>Order ID</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Address</th>
                <th>Product</th>
                <th>Quantity</th>
                <th>Total</th>
                <th>Status</th>
            </tr>

        </thead>

        <tbody id="ordersBody">

            <tr>
                <td colspan="9">
                    Loading orders...
                </td>
            </tr>

        </tbody>

    </table>

</div>

</div><script>

const ADMIN_USERNAME = "temuoffer";
const ADMIN_PASSWORD = "Pkirui00";

/* LOGIN */

function login() {

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const error =
        document.getElementById("loginError");

    if (
        username === ADMIN_USERNAME &&
        password === ADMIN_PASSWORD
    ) {

        document
            .getElementById("loginBox")
            .classList.add("hidden");

        document
            .getElementById("dashboard")
            .classList.remove("hidden");

        error.innerHTML = "";

        loadOrders();

    } else {

        error.innerHTML =
            '<div class="message error">Invalid username or password.</div>';

    }
}

/* ENTER TO LOGIN */

document
    .getElementById("password")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            login();
        }

    });

/* LOAD ORDERS */

async function loadOrders() {

    const body =
        document.getElementById("ordersBody");

    const count =
        document.getElementById("orderCount");

    body.innerHTML =
        "<tr><td colspan='9'>Loading...</td></tr>";

    count.textContent =
        "Loading orders...";

    try {

        const response =
            await fetch("/api/orders");

        const data =
            await response.json();

        if (!response.ok || !data.success) {

            body.innerHTML =
                "<tr><td colspan='9'>Unable to load orders.</td></tr>";

            count.textContent =
                data.message || "Unable to load orders.";

            return;
        }

        if (
            !Array.isArray(data.orders) ||
            data.orders.length === 0
        ) {

            body.innerHTML =
                "<tr><td colspan='9'>No orders found.</td></tr>";

            count.textContent =
                "Total orders: 0";

            return;
        }

        count.textContent =
            "Total orders: " + data.orders.length;

        body.innerHTML =
            data.orders.map(function(order) {

                const orderId =
                    escapeHtml(order.orderId || "N/A");

                const name =
                    escapeHtml(
                        order.fullName ||
                        order.name ||
                        "N/A"
                    );

                const phone =
                    escapeHtml(
                        order.phone || "N/A"
                    );

                const email =
                    escapeHtml(
                        order.email || "N/A"
                    );

                const address =
                    escapeHtml(
                        order.deliveryAddress ||
                        order.address ||
                        "N/A"
                    );

                const product =
                    escapeHtml(
                        order.productName ||
                        "Product"
                    );

                const quantity =
                    escapeHtml(
                        order.quantity || 1
                    );

                const currency =
                    escapeHtml(
                        order.currency || "NZD"
                    );

                const total =
                    Number(
                        order.total || 0
                    ).toFixed(2);

                const status =
                    order.status ||
                    "Pending Payment";

                return `

                    <tr>

                        <td>${orderId}</td>

                        <td>${name}</td>

                        <td>${phone}</td>

                        <td>${email}</td>

                        <td>${address}</td>

                        <td>${product}</td>

                        <td>${quantity}</td>

                        <td>
                            ${currency} ${total}
                        </td>

                        <td class="status-cell">

                            <select
                                id="status-${encodeURIComponent(order.orderId)}"
                            >

                                <option
                                    value="Pending Payment"
                                    ${status === "Pending Payment" ? "selected" : ""}
                                >
                                    Pending Payment
                                </option>

                                <option
                                    value="Payment Received"
                                    ${status === "Payment Received" ? "selected" : ""}
                                >
                                    Payment Received
                                </option>

                                <option
                                    value="Processing"
                                    ${status === "Processing" ? "selected" : ""}
                                >
                                    Processing
                                </option>

                                <option
                                    value="Shipped"
                                    ${status === "Shipped" ? "selected" : ""}
                                >
                                    Shipped
                                </option>

                                <option
                                    value="Delivered"
                                    ${status === "Delivered" ? "selected" : ""}
                                >
                                    Delivered
                                </option>

                                <option
                                    value="Cancelled"
                                    ${status === "Cancelled" ? "selected" : ""}
                                >
                                    Cancelled
                                </option>

                            </select>

                            <button
                                class="save-button"
                                onclick="updateStatus('${escapeJs(order.orderId)}')"
                            >
                                Save Status
                            </button>

                        </td>

                    </tr>

                `;

            }).join("");

    } catch (error) {

        console.error(error);

        body.innerHTML =
            "<tr><td colspan='9'>Server connection error.</td></tr>";

        count.textContent =
            "Unable to connect to server.";
    }
}

/* UPDATE STATUS */

async function updateStatus(orderId) {

    const select =
        document.getElementById(
            "status-" +
            encodeURIComponent(orderId)
        );

    const status =
        select.value;

    const message =
        document.getElementById("statusMessage");

    try {

        const response =
            await fetch(
                "/api/orders/" +
                encodeURIComponent(orderId) +
                "/status",
                {
                    method: "PUT",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        status: status
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok || !data.success) {

            message.innerHTML =
                '<div class="message error">' +
                escapeHtml(
                    data.message ||
                    "Unable to update status."
                ) +
                "</div>";

            return;
        }

        message.innerHTML =
            '<div class="message success">' +
            "Order " +
            escapeHtml(orderId) +
            " updated to " +
            escapeHtml(status) +
            "." +
            "</div>";

        setTimeout(function() {
            message.innerHTML = "";
        }, 3000);

    } catch (error) {

        console.error(error);

        message.innerHTML =
            '<div class="message error">' +
            "Unable to connect to server." +
            "</div>";
    }
}

/* HTML SECURITY */

function escapeHtml(value) {

    return String(value)

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function escapeJs(value) {

    return String(value)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"')
        .replace(/\n/g, "\\n")
        .replace(/\r/g, "\\r");
}

</script></body>
</html>
