<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temuoffer Admin</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0}
header{background:#ff6a00;color:#fff;padding:15px;text-align:center}
.login,.dashboard{max-width:1000px;margin:20px auto;background:#fff;padding:20px;border-radius:10px}
input{width:100%;padding:10px;margin:8px 0}
button{background:#ff6a00;color:#fff;border:none;padding:10px 16px;border-radius:6px;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:20px}
th,td{border:1px solid #ddd;padding:10px;text-align:left}
th{background:#ff6a00;color:#fff}
.hidden{display:none}
</style>
</head>
<body>

<header><h2>Temuoffer Admin Dashboard</h2></header>

<div class="login" id="loginBox">
  <h3>Admin Login</h3>
  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<div class="dashboard hidden" id="dashboard">
  <h3>Customer Orders</h3>
  <button onclick="loadOrders()">Refresh</button>

  <table>
    <thead>
      <tr>
        <th>Order ID</th>
        <th>Name</th>
        <th>Phone</th>
        <th>Email</th>
        <th>Address</th>
        <th>Total</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="ordersBody">
      <tr><td colspan="7">Loading...</td></tr>
    </tbody>
  </table>
</div>

<script>
const ADMIN_USER="temuoffer";
const ADMIN_PASS="Pkirui00";

function login(){
  if(
    document.getElementById("username").value===ADMIN_USER &&
    document.getElementById("password").value===ADMIN_PASS
  ){
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");
    loadOrders();
  }else{
    alert("Invalid login");
  }
}

async function loadOrders(){
  const body=document.getElementById("ordersBody");
  body.innerHTML="<tr><td colspan='7'>Loading...</td></tr>";

  try{
    const res=await fetch("/api/orders");
    const data=await res.json();

    if(!data.success){
      body.innerHTML="<tr><td colspan='7'>Failed to load orders</td></tr>";
      return;
    }

    if(data.orders.length===0){
      body.innerHTML="<tr><td colspan='7'>No orders found</td></tr>";
      return;
    }

    body.innerHTML=data.orders.map(o=>`
      <tr>
        <td>${o.orderId}</td>
        <td>${o.name}</td>
        <td>${o.phone}</td>
        <td>${o.email}</td>
        <td>${o.address}</td>
        <td>${o.currency} ${o.total}</td>
        <td>${o.status}</td>
      </tr>
    `).join("");
  }catch(e){
    body.innerHTML="<tr><td colspan='7'>Server error</td></tr>";
  }
}
</script>

</body>
</html>
