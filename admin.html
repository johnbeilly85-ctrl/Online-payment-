<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temuoffer Admin Dashboard</title><style>
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  margin: 0;
}

header {
  background: #ff6a00;
  color: white;
  padding: 15px;
  text-align: center;
}

.login, .dashboard {
  max-width: 1000px;
  margin: 20px auto;
  background: white;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

input {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 16px;
}

button {
  background: #ff6a00;
  color: white;
  border: none;
  padding: 12px 18px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 16px;
}

.hidden {
  display: none;
}

.message {
  margin-top: 15px;
  padding: 10px;
  border-radius: 6px;
  background: #f1f1f1;
}

.error {
  background: #ffe5e5;
  color: #b00020;
}

.table-container {
  overflow-x: auto;
}

table {
  width: 100%;
  min-width: 850px;
  border-collapse: collapse;
  margin-top: 20px;
}

th, td {
  border: 1px solid #ddd;
  padding: 10px;
  text-align: left;
}

th {
  background: #ff6a00;
  color: white;
}

@media (max-width: 700px) {
  .login, .dashboard {
    margin: 10px;
    padding: 15px;
  }
}
</style></head><body><header>
  <h2>Temuoffer Admin Dashboard</h2>
</header><div class="login" id="loginBox">  <h3>Admin Login</h3><input
type="text"
id="username"
placeholder="Username"
autocomplete="username"

«»

<input
type="password"
id="password"
placeholder="Password"
autocomplete="current-password"

«»

  <button type="button" onclick="login()">
    Login
  </button>  <div id="loginMessage" class="message hidden"></div></div><div class="dashboard hidden" id="dashboard">  <h3>Customer Orders</h3>  <button type="button" onclick="loadOrders()">
    Refresh Orders
  </button>  <div id="orderCount" class="message">
    Loading orders...
  </div>  <div class="table-container"><table>

  <thead>
    <tr>
      <th>Order ID</th>
      <th>Name</th>
      <th>Phone</th>
      <th>Email</th>
      <th>Address</th>
      <th>Product</th>
      <th>Quantity</th>
      <th>Total</th>
      <th>Status</th>
    </tr>
  </thead>

  <tbody id="ordersBody">
    <tr>
      <td colspan="9">Loading...</td>
    </tr>
  </tbody>

</table>

  </div></div><script>

const ADMIN_USER = "temuoffer";
const ADMIN_PASS = "Pkirui00";

function login() {

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  if (username === ADMIN_USER && password === ADMIN_PASS) {

    document
      .getElementById("loginBox")
      .classList.add("hidden");

    document
      .getElementById("dashboard")
      .classList.remove("hidden");

    loadOrders();

  } else {

    message.textContent =
      "Invalid username or password.";

    message.classList.remove("hidden");
    message.classList.add("error");

  }
}

document
  .getElementById("password")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      login();
    }

  });

async function loadOrders() {

  const body =
    document.getElementById("ordersBody");

  const count =
    document.getElementById("orderCount");

  body.innerHTML =
    "<tr><td colspan='9'>Loading...</td></tr>";

  count.textContent =
    "Loading orders...";

  try {

    const response =
      await fetch("/api/orders");

    const data =
      await response.json();

    if (!response.ok || !data.success) {

      body.innerHTML =
        "<tr><td colspan='9'>Failed to load orders</td></tr>";

      count.textContent =
        data.message || "Failed to load orders.";

      return;
    }

    if (!Array.isArray(data.orders) ||
        data.orders.length === 0) {

      body.innerHTML =
        "<tr><td colspan='9'>No orders found</td></tr>";

      count.textContent =
        "No orders found.";

      return;
    }

    count.textContent =
      "Total orders: " + data.orders.length;

    body.innerHTML =
      data.orders.map(function(order) {

        const orderId =
          order.orderId || order._id || "N/A";

        const name =
          order.fullName ||
          order.name ||
          "N/A";

        const phone =
          order.phone || "N/A";

        const email =
          order.email || "N/A";

        const address =
          order.deliveryAddress ||
          order.address ||
          "N/A";

        const product =
          order.productName ||
          order.product ||
          "Product";

        const quantity =
          order.quantity || 1;

        const currency =
          order.currency || "NZD";

        const total =
          Number(
            order.total ||
            order.amount ||
            0
          ).toFixed(2);

        const status =
          order.status ||
          "Pending Payment";

        return `
          <tr>
            <td>${escapeHtml(orderId)}</td>
            <td>${escapeHtml(name)}</td>
            <td>${escapeHtml(phone)}</td>
            <td>${escapeHtml(email)}</td>
            <td>${escapeHtml(address)}</td>
            <td>${escapeHtml(product)}</td>
            <td>${escapeHtml(quantity)}</td>
            <td>${escapeHtml(currency)} ${escapeHtml(total)}</td>
            <td>${escapeHtml(status)}</td>
          </tr>
        `;

      }).join("");

  } catch (error) {

    console.error(error);

    body.innerHTML =
      "<tr><td colspan='9'>Server error</td></tr>";

    count.textContent =
      "Unable to connect to server.";

  }
}

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script></body>
</html>
