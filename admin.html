<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temuoffer Admin</title><style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

header {
    background: #ff6a00;
    color: white;
    text-align: center;
    padding: 20px;
}

.box {
    max-width: 400px;
    margin: 40px auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.15);
}

h3 {
    text-align: center;
}

input {
    display: block;
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    margin: 12px 0;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    background: #ff6a00;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    background: #e55d00;
}

#error {
    color: red;
    text-align: center;
    margin-top: 15px;
}
</style></head><body><header>
    <h2>Temuoffer Admin Dashboard</h2>
</header><div class="box" id="loginBox"><h3>Admin Login</h3>

<label>Username</label>

<input
    type="text"
    id="username"
    placeholder="Enter username"
>

<label>Password</label>

<input
    type="password"
    id="password"
    placeholder="Enter password"
>

<button onclick="login()">
    Login
</button>

<div id="error"></div>

</div><div class="box" id="dashboard" style="display:none;"><h3>Customer Orders</h3>

<button onclick="loadOrders()">
    Refresh Orders
</button>

<p id="count">Loading orders...</p>

<div id="orders"></div>

</div><script>

const ADMIN_USERNAME = "temuoffer";
const ADMIN_PASSWORD = "Pkirui00";

function login() {

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const error =
        document.getElementById("error");

    if (
        username === ADMIN_USERNAME &&
        password === ADMIN_PASSWORD
    ) {

        document.getElementById("loginBox").style.display = "none";

        document.getElementById("dashboard").style.display = "block";

        error.textContent = "";

        loadOrders();

    } else {

        error.textContent =
            "Invalid username or password.";

    }
}

async function loadOrders() {

    const ordersDiv =
        document.getElementById("orders");

    const count =
        document.getElementById("count");

    ordersDiv.innerHTML = "Loading...";

    try {

        const response =
            await fetch("/api/orders");

        const data =
            await response.json();

        if (!response.ok || !data.success) {

            ordersDiv.innerHTML =
                "Unable to load orders.";

            count.textContent =
                data.message || "Error";

            return;
        }

        if (!data.orders || data.orders.length === 0) {

            ordersDiv.innerHTML =
                "<p>No orders found.</p>";

            count.textContent =
                "Total orders: 0";

            return;
        }

        count.textContent =
            "Total orders: " + data.orders.length;

        ordersDiv.innerHTML =
            data.orders.map(order => {

                return `
                <div style="
                    border:1px solid #ddd;
                    padding:15px;
                    margin:12px 0;
                    border-radius:8px;
                    background:#fafafa;
                ">

                    <strong>Order ID:</strong>
                    ${order.orderId || "N/A"}<br><br>

                    <strong>Name:</strong>
                    ${order.fullName || order.name || "N/A"}<br>

                    <strong>Phone:</strong>
                    ${order.phone || "N/A"}<br>

                    <strong>Email:</strong>
                    ${order.email || "N/A"}<br>

                    <strong>Address:</strong>
                    ${order.deliveryAddress || order.address || "N/A"}<br>

                    <strong>Product:</strong>
                    ${order.productName || "Product"}<br>

                    <strong>Quantity:</strong>
                    ${order.quantity || 1}<br>

                    <strong>Total:</strong>
                    ${order.currency || "NZD"}
                    ${Number(order.total || 0).toFixed(2)}<br>

                    <strong>Status:</strong>
                    ${order.status || "Pending Payment"}

                </div>
                `;

            }).join("");

    } catch (error) {

        console.error(error);

        ordersDiv.innerHTML =
            "Server connection error.";

        count.textContent =
            "Unable to connect to server.";

    }
}

document
    .getElementById("password")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            login();
        }

    });

</script></body>
</html>
