<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Temuoffer - Checkout</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#222;
}

header{
  background:#ffffff;
  padding:18px 20px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:25px;
  font-weight:bold;
  color:#e53935;
}

.back{
  text-decoration:none;
  color:#333;
  font-weight:bold;
}

.container{
  max-width:700px;
  margin:30px auto;
  padding:0 16px;
}

.card{
  background:white;
  border-radius:14px;
  padding:22px;
  margin-bottom:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

h1{
  margin-top:0;
  font-size:28px;
}

h2{
  font-size:20px;
  margin-top:0;
}

label{
  display:block;
  font-weight:bold;
  margin-top:15px;
  margin-bottom:6px;
}

input,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.product{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.product:last-child{
  border-bottom:none;
}

.product-name{
  font-weight:bold;
}

.product-price{
  white-space:nowrap;
  font-weight:bold;
}

.total{
  display:flex;
  justify-content:space-between;
  font-size:22px;
  font-weight:bold;
  padding-top:18px;
}

button{
  width:100%;
  border:none;
  border-radius:9px;
  padding:15px;
  margin-top:20px;
  background:#e53935;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#c62828;
}

button:disabled{
  background:#aaa;
  cursor:not-allowed;
}

.message{
  display:none;
  padding:14px;
  border-radius:8px;
  margin-top:15px;
  font-weight:bold;
}

.success{
  background:#e8f5e9;
  color:#2e7d32;
}

.error{
  background:#ffebee;
  color:#c62828;
}

.empty{
  text-align:center;
  padding:25px;
  color:#777;
}
</style>
</head>

<body>

<header>
  <div class="logo">Temuoffer</div>
  <a class="back" href="index.html">← Back to Store</a>
</header>

<div class="container">

  <div class="card">
    <h1>Checkout</h1>
    <p>Please enter your details below to place your order.</p>

    <label for="name">Full Name</label>
    <input
      type="text"
      id="name"
      placeholder="Enter your full name"
      autocomplete="name"
    >

    <label for="email">Email Address</label>
    <input
      type="email"
      id="email"
      placeholder="Enter your email address"
      autocomplete="email"
    >

    <label for="phone">Phone Number</label>
    <input
      type="tel"
      id="phone"
      placeholder="Enter your phone number"
      autocomplete="tel"
    >

    <label for="address">Delivery Address</label>
    <textarea
      id="address"
      placeholder="Enter your complete delivery address"
      autocomplete="street-address"
    ></textarea>

    <button id="payButton" onclick="payNow()">
      Continue to Payment
    </button>

    <div id="message" class="message"></div>
  </div>

  <div class="card">
    <h2>Order Summary</h2>

    <div id="orderItems"></div>

    <div class="total">
      <span>Total</span>
      <span id="total">NZ$0.00</span>
    </div>
  </div>

</div>

<script>

const CART_KEY = "temuofferCart";

let cart = [];

function money(amount){
  return new Intl.NumberFormat("en-NZ", {
    style:"currency",
    currency:"NZD"
  }).format(Number(amount) || 0);
}

function showMessage(message, type){
  const box = document.getElementById("message");

  box.textContent = message;
  box.className = "message " + type;
  box.style.display = "block";
}

function loadCart(){

  try{
    cart = JSON.parse(localStorage.getItem(CART_KEY)) || [];
  }catch(error){
    cart = [];
  }

  const itemsContainer = document.getElementById("orderItems");

  if(!cart.length){

    itemsContainer.innerHTML = `
      <div class="empty">
        Your cart is empty.
        <br><br>
        <a href="index.html">Return to store</a>
      </div>
    `;

    document.getElementById("total").textContent = money(0);
    document.getElementById("payButton").disabled = true;

    return;
  }

  let total = 0;

  itemsContainer.innerHTML = "";

  cart.forEach((item) => {

    const price = Number(item.price) || 0;
    const quantity = Number(item.quantity) || 1;
    const itemTotal = price * quantity;

    total += itemTotal;

    const row = document.createElement("div");
    row.className = "product";

    row.innerHTML = `
      <div>
        <div class="product-name">${escapeHtml(item.name || "Product")}</div>
        <div>Quantity: ${quantity}</div>
      </div>

      <div class="product-price">
        ${money(itemTotal)}
      </div>
    `;

    itemsContainer.appendChild(row);
  });

  document.getElementById("total").textContent = money(total);
}

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function calculateTotal(){

  return cart.reduce((sum, item) => {

    const price = Number(item.price) || 0;
    const quantity = Number(item.quantity) || 1;

    return sum + (price * quantity);

  }, 0);
}

async function payNow(){

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const address = document.getElementById("address").value.trim();

  if(!cart.length){

    showMessage("Your cart is empty.", "error");
    return;
  }

  if(!name){

    showMessage("Please enter your full name.", "error");
    return;
  }

  if(!email){

    showMessage("Please enter your email address.", "error");
    return;
  }

  if(!phone){

    showMessage("Please enter your phone number.", "error");
    return;
  }

  if(!address){

    showMessage("Please enter your delivery address.", "error");
    return;
  }

  const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  if(!emailPattern.test(email)){

    showMessage("Please enter a valid email address.", "error");
    return;
  }

  const total = calculateTotal();

  const orderData = {

    name: name,
    email: email,
    phone: phone,
    address: address,

    products: cart,

    total: total,

    currency: "NZD"
  };

  const button = document.getElementById("payButton");

  button.disabled = true;
  button.textContent = "Submitting Order...";

  document.getElementById("message").style.display = "none";

  try{

    const response = await fetch("/api/order", {

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify(orderData)

    });

    const data = await response.json();

    if(!response.ok || !data.success){

      throw new Error(
        data.message || "Unable to submit your order."
      );
    }

    localStorage.setItem(
      "temuofferOrder",
      JSON.stringify(data.order)
    );

    showMessage(
      "Order received successfully! Order ID: " + data.orderId,
      "success"
    );

    button.textContent = "Order Received";

    /*
      Paystack will be connected here after
      your Paystack account is approved.
    */

  }catch(error){

    console.error("Order submission error:", error);

    showMessage(
      error.message || "Something went wrong. Please try again.",
      "error"
    );

    button.disabled = false;
    button.textContent = "Continue to Payment";
  }
}

loadCart();

</script>

</body>
</html>
