<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temuoffer - Online Store</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5}
header{background:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.logo{font-size:28px;font-weight:bold;color:#ff4b2b}
.cart-btn{background:#ff4b2b;color:#fff;border:none;padding:10px 15px;border-radius:8px;cursor:pointer}
.hero{background:#fff;padding:30px 20px;text-align:center}
.search{max-width:500px;margin:20px auto}
.search input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px}
.categories{display:flex;gap:10px;overflow:auto;padding:15px;background:#fff}
.categories button{padding:10px 15px;border:1px solid #ddd;border-radius:20px;background:#fff;cursor:pointer}
.products{padding:20px;max-width:1000px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:15px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.image{height:160px;display:flex;align-items:center;justify-content:center;font-size:55px;background:#eee}
.info{padding:15px}
.price{color:#e63b1f;font-weight:bold;font-size:18px}
.add{width:100%;margin-top:10px;padding:10px;border:none;background:#ff4b2b;color:#fff;border-radius:8px;cursor:pointer}
.cart-panel{display:none;position:fixed;right:0;top:0;width:100%;max-width:350px;height:100%;background:#fff;padding:20px;box-shadow:-3px 0 15px rgba(0,0,0,.2);overflow:auto}
.item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}
.checkout{width:100%;padding:14px;background:#00a859;color:#fff;border:none;border-radius:8px;margin-top:20px;cursor:pointer}
.close{float:right;border:none;background:none;font-size:28px;cursor:pointer}
footer{background:#222;color:#fff;text-align:center;padding:20px;margin-top:30px}
</style>
</head>
<body>

<header>
<div class="logo">Temuoffer</div>
<button class="cart-btn" onclick="openCart()">🛒 <span id="count">0</span></button>
</header>

<section class="hero">
<h1>Welcome to Temuoffer</h1>
<p>Great offers for everyone.</p>
<div class="search">
<input id="search" placeholder="Search products..." oninput="showProducts()">
</div>
</section>

<div class="categories">
<button onclick="filter('All')">All</button>
<button onclick="filter('Electronics')">Electronics</button>
<button onclick="filter('Fashion')">Fashion</button>
<button onclick="filter('Home')">Home</button>
<button onclick="filter('Beauty')">Beauty</button>
</div>

<section class="products">
<div id="grid" class="grid"></div>
</section>

<div id="cart" class="cart-panel">
<button class="close" onclick="closeCart()">×</button>
<h2>Your Cart</h2>
<div id="items"></div>
<h3>Total: KES <span id="total">0</span></h3>
<button class="checkout" onclick="checkout()">Proceed to Checkout</button>
</div>

<footer>© 2026 Temuoffer</footer>

<script>
const products=[
{id:1,name:"Wireless Earbuds",price:1500,cat:"Electronics",icon:"🎧"},
{id:2,name:"Smart Watch",price:2500,cat:"Electronics",icon:"⌚"},
{id:3,name:"Handbag",price:1800,cat:"Fashion",icon:"👜"},
{id:4,name:"Sneakers",price:3200,cat:"Fashion",icon:"👟"},
{id:5,name:"Kitchen Set",price:2200,cat:"Home",icon:"🍳"},
{id:6,name:"LED Lamp",price:1300,cat:"Home",icon:"💡"},
{id:7,name:"Beauty Kit",price:2000,cat:"Beauty",icon:"💄"},
{id:8,name:"Hair Dryer",price:2800,cat:"Beauty",icon:"💇"}
];

let cart=[];
let category="All";

function showProducts(){
const text=document.getElementById("search").value.toLowerCase();
const grid=document.getElementById("grid");
grid.innerHTML="";
products.filter(p=>(category==="All"||p.cat===category)&&p.name.toLowerCase().includes(text)).forEach(p=>{
grid.innerHTML+=`
<div class="card">
<div class="image">${p.icon}</div>
<div class="info">
<b>${p.name}</b>
<div class="price">KES ${p.price}</div>
<button class="add" onclick="add(${p.id})">Add to Cart</button>
</div></div>`;
});
}

function filter(c){category=c;showProducts();}
function add(id){cart.push(products.find(p=>p.id===id));updateCart();}
function updateCart(){
document.getElementById("count").textContent=cart.length;
let total=0;
const items=document.getElementById("items");
items.innerHTML="";
cart.forEach(i=>{
total+=i.price;
items.innerHTML+=`<div class="item"><span>${i.name}</span><span>KES ${i.price}</span></div>`;
});
document.getElementById("total").textContent=total;
}
function openCart(){document.getElementById("cart").style.display="block";}
function closeCart(){document.getElementById("cart").style.display="none";}
function checkout(){
if(cart.length===0){alert("Your cart is empty.");return;}
localStorage.setItem("temuofferCart",JSON.stringify(cart));
window.location.href="checkout.html";
}
showProducts();
</script>

</body>
</html>
