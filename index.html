<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temuoffer - Online Store</title><style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#fff;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:28px;
  font-weight:bold;
  color:#ff4b2b;
}

.cart-btn{
  background:#ff4b2b;
  color:#fff;
  border:none;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.hero{
  background:#fff;
  padding:30px 20px;
  text-align:center;
}

.hero h1{
  margin:0 0 10px;
  font-size:32px;
}

.hero p{
  color:#666;
}

.search{
  max-width:500px;
  margin:20px auto;
}

.search input{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

.categories{
  display:flex;
  gap:10px;
  overflow:auto;
  padding:15px 20px;
  background:#fff;
}

.categories button{
  padding:10px 15px;
  border:1px solid #ddd;
  border-radius:20px;
  background:#fff;
  cursor:pointer;
  white-space:nowrap;
}

.categories button.active{
  background:#ff4b2b;
  color:#fff;
  border-color:#ff4b2b;
}

.products{
  padding:25px 20px;
  max-width:1100px;
  margin:auto;
}

.products h2{
  margin-top:0;
}

.loading{
  text-align:center;
  padding:30px;
  color:#666;
}

.error{
  background:#ffe5e5;
  color:#b00020;
  padding:15px;
  border-radius:8px;
  text-align:center;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:18px;
}

.card{
  background:#fff;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
  position:relative;
}

.image{
  height:180px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eee;
  overflow:hidden;
}

.image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.no-image{
  font-size:55px;
}

.offer-badge{
  position:absolute;
  top:10px;
  left:10px;
  background:#ff4b2b;
  color:#fff;
  padding:6px 9px;
  border-radius:6px;
  font-size:12px;
  font-weight:bold;
}

.info{
  padding:15px;
}

.name{
  font-weight:bold;
  margin-bottom:8px;
}

.category{
  color:#777;
  font-size:13px;
  margin-bottom:8px;
}

.original{
  color:#888;
  text-decoration:line-through;
  font-size:14px;
}

.price{
  color:#e63b1f;
  font-weight:bold;
  font-size:19px;
  margin-top:4px;
}

.save{
  color:#00a859;
  font-size:13px;
  font-weight:bold;
  margin-top:5px;
}

.stock{
  font-size:13px;
  color:#666;
  margin-top:7px;
}

.add{
  width:100%;
  margin-top:12px;
  padding:11px;
  border:none;
  background:#ff4b2b;
  color:#fff;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.add:disabled{
  background:#aaa;
  cursor:not-allowed;
}

.cart-panel{
  display:none;
  position:fixed;
  right:0;
  top:0;
  width:100%;
  max-width:380px;
  height:100%;
  background:#fff;
  padding:20px;
  box-shadow:-3px 0 15px rgba(0,0,0,.2);
  overflow:auto;
  z-index:100;
}

.close{
  float:right;
  border:none;
  background:none;
  font-size:28px;
  cursor:pointer;
}

.item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.remove{
  border:none;
  background:#ffe5e5;
  color:#b00020;
  padding:5px 8px;
  border-radius:5px;
  cursor:pointer;
}

.total{
  font-size:21px;
  font-weight:bold;
  margin-top:20px;
}

.checkout{
  width:100%;
  padding:14px;
  background:#00a859;
  color:#fff;
  border:none;
  border-radius:8px;
  margin-top:20px;
  cursor:pointer;
  font-size:17px;
  font-weight:bold;
}

footer{
  background:#222;
  color:#fff;
  text-align:center;
  padding:25px;
  margin-top:30px;
}

@media(max-width:500px){
  .hero h1{
    font-size:27px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .image{
    height:150px;
  }

  .info{
    padding:10px;
  }

  .name{
    font-size:14px;
  }

  .price{
    font-size:17px;
  }
}
</style></head><body><header>
  <div class="logo">Temuoffer</div>  <button class="cart-btn" onclick="openCart()">
    🛒 Cart (<span id="count">0</span>)
  </button>
</header><section class="hero">  <h1>Welcome to Temuoffer</h1>  <p>
    Shop online for great products and great offers.
  </p>  <div class="search">
    <input
      id="search"
      type="text"
      placeholder="Search products..."
      oninput="showProducts()"
    >
  </div></section><div class="categories"><button class="active"
onclick="filterCategory('All',this)">
All
</button>

<button
onclick="filterCategory('Electronics',this)">
Electronics
</button>

<button
onclick="filterCategory('Fashion',this)">
Fashion
</button>

<button
onclick="filterCategory('Home',this)">
Home
</button>

<button
onclick="filterCategory('Beauty',this)">
Beauty
</button>

<button
onclick="filterCategory('Phones',this)">
Phones
</button>

<button
onclick="filterCategory('Laptops & Tablets',this)">
Laptops & Tablets
</button>

</div><section class="products">  <h2>Featured Products</h2>  <div id="message" class="loading">
    Loading products...
  </div>  <div id="grid" class="grid"></div></section><div id="cart" class="cart-panel"><button class="close" onclick="closeCart()">×</button>

  <h2>Your Cart</h2>  <div id="items"></div>  <div class="total">
    Total: NZ$ <span id="total">0.00</span>
  </div>  <button class="checkout" onclick="checkout()">
    Proceed to Checkout
  </button></div><footer>
  © 2026 Temuoffer. All rights reserved.
</footer><script>

let products = [];

let cart = [];

let category = "All";


/* ==========================
   LOAD PRODUCTS FROM SERVER
========================== */

async function loadProducts(){

  const message =
    document.getElementById("message");

  try{

    const response =
      await fetch("/api/products");

    if(!response.ok){
      throw new Error("Server error");
    }

    const data =
      await response.json();

    if(!data.success){
      throw new Error(
        data.message || "Failed to load products"
      );
    }

    products =
      Array.isArray(data.products)
      ? data.products
      : [];

    message.style.display = "none";

    showProducts();

  }catch(error){

    console.error(
      "Product loading error:",
      error
    );

    message.className = "error";

    message.innerHTML =
      "Unable to load products. Please refresh the page.";

  }

}


/* ==========================
   MONEY
========================== */

function money(amount){

  return Number(amount || 0).toLocaleString(
    "en-NZ",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

}


/* ==========================
   SHOW PRODUCTS
========================== */

function showProducts(){

  const searchInput =
    document.getElementById("search");

  const text =
    searchInput
      ? searchInput.value.toLowerCase()
      : "";

  const grid =
    document.getElementById("grid");

  grid.innerHTML = "";

  const filtered =
    products.filter(product => {

      const productCategory =
        product.category || product.cat || "";

      const productName =
        product.name || "";

      return (

        (category === "All" ||
         productCategory === category)

        &&

        productName
          .toLowerCase()
          .includes(text)

      );

    });


  if(filtered.length === 0){

    grid.innerHTML =
      "<p>No products found.</p>";

    return;

  }


  filtered.forEach(product => {

    const id =
      product.productId ||
      product._id;

    const name =
      product.name || "Product";

    const cat =
      product.category || "General";

    const offerPrice =
      Number(
        product.offerPrice ??
        product.price ??
        0
      );

    const originalPrice =
      Number(
        product.originalPrice ??
        offerPrice
      );

    const stock =
      Number(product.stock || 0);

    const image =
      product.image || "";

    const onOffer =
      product.onOffer === true &&
      originalPrice > offerPrice;

    const discount =
      Number(
        product.discountPercent || 0
      );


    let imageHTML = "";

    if(image){

      imageHTML = `
        <img
          src="${escapeHTML(image)}"
          alt="${escapeHTML(name)}"
          onerror="this.style.display='none';this.nextElementSibling.style.display='block';"
        >
        <div
          class="no-image"
          style="display:none"
        >
          🛍️
        </div>
      `;

    }else{

      imageHTML = `
        <div class="no-image">
          🛍️
        </div>
      `;

    }


    grid.innerHTML += `

      <div class="card">

        ${
          onOffer
          ? `
            <div class="offer-badge">
              🔥 SAVE ${discount}%
            </div>
          `
          : ""
        }

        <div class="image">
          ${imageHTML}
        </div>

        <div class="info">

          <div class="name">
            ${escapeHTML(name)}
          </div>

          <div class="category">
            ${escapeHTML(cat)}
          </div>

          ${
            onOffer
            ? `
              <div class="original">
                NZ$ ${money(originalPrice)}
              </div>
            `
            : ""
          }

          <div class="price">
            NZ$ ${money(offerPrice)}
          </div>

          ${
            onOffer
            ? `
              <div class="save">
                SAVE ${discount}%
              </div>
            `
            : ""
          }

          <div class="stock">
            ${
              stock > 0
              ? `In stock: ${stock}`
              : "Out of stock"
            }
          </div>

          <button
            class="add"
            onclick="addToCart('${escapeJS(String(id))}')"
            ${stock <= 0 ? "disabled" : ""}
          >
            ${
              stock > 0
              ? "Add to Cart"
              : "Out of Stock"
            }
          </button>

        </div>

      </div>

    `;

  });

}


/* ==========================
   ESCAPE HTML
========================== */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ==========================
   ESCAPE JAVASCRIPT
========================== */

function escapeJS(value){

  return String(value)
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/"/g,'\\"');

}


/* ==========================
   CATEGORY
========================== */

function filterCategory(cat,button){

  category = cat;

  document
    .querySelectorAll(".categories button")
    .forEach(btn =>
      btn.classList.remove("active")
    );

  button.classList.add("active");

  showProducts();

}


/* ==========================
   ADD TO CART
========================== */

function addToCart(id){

  const product =
    products.find(p =>
      String(p.productId || p._id) === String(id)
    );

  if(!product){
    alert("Product not found.");
    return;
  }

  const stock =
    Number(product.stock || 0);

  if(stock <= 0){
    alert("This product is out of stock.");
    return;
  }

  cart.push({

    id:
      product.productId ||
      product._id,

    name:
      product.name,

    price:
      Number(
        product.offerPrice ??
        product.price ??
        0
      ),

    quantity:1

  });

  updateCart();

}


/* ==========================
   REMOVE FROM CART
========================== */

function removeFromCart(index){

  cart.splice(index,1);

  updateCart();

}


/* ==========================
   UPDATE CART
========================== */

function updateCart(){

  document.getElementById("count")
    .textContent = cart.length;

  const items =
    document.getElementById("items");

  items.innerHTML = "";

  let total = 0;


  cart.forEach((item,index) => {

    total +=
      Number(item.price || 0);


    items.innerHTML += `

      <div class="item">

        <div>

          <strong>
            ${escapeHTML(item.name)}
          </strong>

          <br>

          NZ$ ${money(item.price)}

        </div>

        <button
          class="remove"
          onclick="removeFromCart(${index})"
        >
          Remove
        </button>

      </div>

    `;

  });


  document.getElementById("total")
    .textContent = money(total);

}


/* ==========================
   OPEN CART
========================== */

function openCart(){

  document.getElementById("cart")
    .style.display = "block";

}


/* ==========================
   CLOSE CART
========================== */

function closeCart(){

  document.getElementById("cart")
    .style.display = "none";

}


/* ==========================
   CHECKOUT
========================== */

function checkout(){

  if(cart.length === 0){

    alert("Your cart is empty.");

    return;

  }


  localStorage.setItem(
    "temuofferCart",
    JSON.stringify(cart)
  );


  window.location.href =
    "checkout.html";

}


/* ==========================
   START
========================== */

loadProducts();

</script></body>
</html>
