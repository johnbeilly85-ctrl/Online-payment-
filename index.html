<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temuoffer - Online Store</title><style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#fff;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:28px;
  font-weight:bold;
  color:#ff4b2b;
}

.cart-btn{
  background:#ff4b2b;
  color:#fff;
  border:none;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.hero{
  background:#fff;
  padding:30px 20px;
  text-align:center;
}

.hero h1{
  margin:0 0 10px;
  font-size:32px;
}

.hero p{
  color:#666;
}

.search{
  max-width:500px;
  margin:20px auto;
}

.search input{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

.categories{
  display:flex;
  gap:10px;
  overflow:auto;
  padding:15px 20px;
  background:#fff;
}

.categories button{
  padding:10px 15px;
  border:1px solid #ddd;
  border-radius:20px;
  background:#fff;
  cursor:pointer;
  white-space:nowrap;
}

.categories button.active{
  background:#ff4b2b;
  color:#fff;
  border-color:#ff4b2b;
}

.products{
  padding:25px 20px;
  max-width:1100px;
  margin:auto;
}

.products h2{
  margin-top:0;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:18px;
}

.card{
  background:#fff;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.image{
  height:180px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:60px;
  background:#eee;
}

.info{
  padding:15px;
}

.name{
  font-weight:bold;
  margin-bottom:8px;
}

.price{
  color:#e63b1f;
  font-weight:bold;
  font-size:19px;
}

.add{
  width:100%;
  margin-top:12px;
  padding:11px;
  border:none;
  background:#ff4b2b;
  color:#fff;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.cart-panel{
  display:none;
  position:fixed;
  right:0;
  top:0;
  width:100%;
  max-width:380px;
  height:100%;
  background:#fff;
  padding:20px;
  box-shadow:-3px 0 15px rgba(0,0,0,.2);
  overflow:auto;
  z-index:100;
}

.close{
  float:right;
  border:none;
  background:none;
  font-size:28px;
  cursor:pointer;
}

.item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.remove{
  border:none;
  background:#ffe5e5;
  color:#b00020;
  padding:5px 8px;
  border-radius:5px;
  cursor:pointer;
}

.total{
  font-size:21px;
  font-weight:bold;
  margin-top:20px;
}

.checkout{
  width:100%;
  padding:14px;
  background:#00a859;
  color:#fff;
  border:none;
  border-radius:8px;
  margin-top:20px;
  cursor:pointer;
  font-size:17px;
  font-weight:bold;
}

footer{
  background:#222;
  color:#fff;
  text-align:center;
  padding:25px;
  margin-top:30px;
}

@media(max-width:500px){
  .hero h1{
    font-size:27px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .image{
    height:150px;
  }
}
</style></head><body><header>  <div class="logo">
    Temuoffer
  </div>  <button class="cart-btn" onclick="openCart()">
    🛒 Cart (<span id="count">0</span>)
  </button></header><section class="hero">  <h1>Welcome to Temuoffer</h1>  <p>
    Shop online for great products and great offers.
  </p>  <div class="search"><input
  id="search"
  type="text"
  placeholder="Search products..."
  oninput="showProducts()"
>

  </div></section><div class="categories">  <button class="active" onclick="filterCategory('All',this)">
    All
  </button>  <button onclick="filterCategory('Electronics',this)">
    Electronics
  </button>  <button onclick="filterCategory('Fashion',this)">
    Fashion
  </button>  <button onclick="filterCategory('Home',this)">
    Home
  </button>  <button onclick="filterCategory('Beauty',this)">
    Beauty
  </button></div><section class="products">  <h2>Featured Products</h2>  <div id="grid" class="grid"></div></section><div id="cart" class="cart-panel"><button class="close" onclick="closeCart()">×</button>

  <h2>Your Cart</h2>  <div id="items"></div>  <div class="total">
    Total: NZ$ <span id="total">0.00</span>
  </div>  <button class="checkout" onclick="checkout()">
    Proceed to Checkout
  </button></div><footer>© 2026 Temuoffer. All rights reserved.

</footer><script>

const products = [

  {
    id:1,
    name:"Wireless Earbuds",
    price:39.99,
    cat:"Electronics",
    icon:"🎧"
  },

  {
    id:2,
    name:"Smart Watch",
    price:59.99,
    cat:"Electronics",
    icon:"⌚"
  },

  {
    id:3,
    name:"Fashion Handbag",
    price:49.99,
    cat:"Fashion",
    icon:"👜"
  },

  {
    id:4,
    name:"Men's Sneakers",
    price:69.99,
    cat:"Fashion",
    icon:"👟"
  },

  {
    id:5,
    name:"Kitchen Set",
    price:44.99,
    cat:"Home",
    icon:"🍳"
  },

  {
    id:6,
    name:"LED Table Lamp",
    price:34.99,
    cat:"Home",
    icon:"💡"
  },

  {
    id:7,
    name:"Beauty Kit",
    price:39.99,
    cat:"Beauty",
    icon:"💄"
  },

  {
    id:8,
    name:"Hair Dryer",
    price:54.99,
    cat:"Beauty",
    icon:"💇"
  }

];

let cart = [];

let category = "All";


function money(amount){

  return Number(amount).toLocaleString(
    "en-NZ",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

}


function showProducts(){

  const text =
    document.getElementById("search")
    .value
    .toLowerCase();

  const grid =
    document.getElementById("grid");

  grid.innerHTML = "";

  const filtered =
    products.filter(product =>

      (category === "All" ||
       product.cat === category)

      &&

      product.name
        .toLowerCase()
        .includes(text)

    );

  if(filtered.length === 0){

    grid.innerHTML =
      "<p>No products found.</p>";

    return;

  }

  filtered.forEach(product => {

    grid.innerHTML += `

      <div class="card">

        <div class="image">
          ${product.icon}
        </div>

        <div class="info">

          <div class="name">
            ${product.name}
          </div>

          <div class="price">
            NZ$ ${money(product.price)}
          </div>

          <button
            class="add"
            onclick="addToCart(${product.id})"
          >
            Add to Cart
          </button>

        </div>

      </div>

    `;

  });

}


function filterCategory(cat,button){

  category = cat;

  document
    .querySelectorAll(".categories button")
    .forEach(btn =>
      btn.classList.remove("active")
    );

  button.classList.add("active");

  showProducts();

}


function addToCart(id){

  const product =
    products.find(p => p.id === id);

  cart.push(product);

  updateCart();

}


function removeFromCart(index){

  cart.splice(index,1);

  updateCart();

}


function updateCart(){

  document.getElementById("count")
    .textContent = cart.length;

  const items =
    document.getElementById("items");

  items.innerHTML = "";

  let total = 0;

  cart.forEach((item,index) => {

    total += Number(item.price);

    items.innerHTML += `

      <div class="item">

        <div>

          <strong>
            ${item.name}
          </strong>

          <br>

          NZ$ ${money(item.price)}

        </div>

        <button
          class="remove"
          onclick="removeFromCart(${index})"
        >
          Remove
        </button>

      </div>

    `;

  });

  document.getElementById("total")
    .textContent = money(total);

}


function openCart(){

  document.getElementById("cart")
    .style.display = "block";

}


function closeCart(){

  document.getElementById("cart")
    .style.display = "none";

}


function checkout(){

  if(cart.length === 0){

    alert("Your cart is empty.");

    return;

  }

  localStorage.setItem(
    "temuofferCart",
    JSON.stringify(cart)
  );

  window.location.href =
    "checkout.html";

}


showProducts();

</script></body>
</html>
